<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BK-Study ist umgezogen</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#12131c;--ink:#eef0ff;--muted:#a3a8c3;--acc:#7c5cff}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,system-ui,sans-serif;padding:16px;text-align:center}
a{color:#fff;background:var(--acc);padding:12px 22px;border-radius:12px;text-decoration:none;font-weight:700;display:inline-block;margin-top:14px}
p{color:var(--muted)}
</style></head><body>
<div><h1>BK-Study ist umgezogen 🚀</h1>
<p>Neue Adresse: <b>studybk.win</b><br>Dein Lernstand wird mitgenommen.</p>
<a id="go" href="https://studybk.win/">Weiter zu studybk.win</a></div>
<script>
/* Lernstand aus diesem Browser mitnehmen: steht nur im #-Teil der Adresse, der geht an keinen Server. */
(function(){
  let url="https://studybk.win/";
  try{
    const d={};
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);d[k]=localStorage.getItem(k)}
    if(Object.keys(d).length){
      let b=btoa(unescape(encodeURIComponent(JSON.stringify(d))));
      if(b.length<1500000)url+="#bkimport="+b;
    }
  }catch(e){}
  document.getElementById("go").href=url;
  location.replace(url);
})();
</script>
</body></html>
