<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BK-Study ist umgezogen</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#12162a;--card:rgba(27,33,64,.9);--ink:#eef1fa;--muted:#a3abc8;--a1:#7c5cff;--a2:#ff5a6e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,system-ui,sans-serif;padding:16px;overflow-x:hidden;position:relative}
body::before,body::after{content:"";position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(110px);opacity:.35;z-index:0}
body::before{background:var(--a1);top:-300px;left:-250px}body::after{background:var(--a2);bottom:-320px;right:-260px}
.card{position:relative;z-index:1;max-width:460px;width:100%;background:var(--card);border:1px solid #2e3760;border-radius:22px;padding:30px 24px;text-align:center}
.big{font-size:52px;line-height:1}
h1{margin:12px 0 6px;font-size:28px}
p{color:var(--muted);margin:8px 0}
.url{display:inline-block;margin:10px 0 4px;font-size:26px;font-weight:800;background:linear-gradient(100deg,#fff,#a78bfa 55%,var(--a2));-webkit-background-clip:text;color:transparent}
a.btn{display:block;margin:18px 0 8px;padding:14px;border-radius:14px;background:linear-gradient(100deg,var(--a1),var(--a2));color:#fff;font-weight:800;text-decoration:none;font-size:18px}
.small{font-size:14px}
</style></head><body>
<div class="card">
  <div class="big">🚀</div>
  <h1>Wir sind umgezogen!</h1>
  <p>BK-Study hat jetzt eine eigene Adresse:</p>
  <div class="url">studybk.win</div>
  <p>Dein Lernstand und dein Konto kommen automatisch mit.</p>
  <a class="btn" id="go" href="https://studybk.win/">Zur neuen Seite</a>
  <p class="small" id="cd">Du wirst gleich weitergeleitet …</p>
  <p class="small">📱 Hast du BK-Study auf dem Homescreen? Öffne <b>studybk.win</b> und füge die Seite neu hinzu.</p>
</div>
<script>
/* Lernstand aus diesem Browser mitnehmen: steht nur im #-Teil der Adresse, der geht an keinen Server. */
(function(){
  let url="https://studybk.win/";
  try{
    const d={};
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);d[k]=localStorage.getItem(k)}
    if(Object.keys(d).length){
      const b=btoa(unescape(encodeURIComponent(JSON.stringify(d))));
      if(b.length<1500000)url+="#bkimport="+b;
    }
  }catch(e){}
  document.getElementById("go").href=url;
  let n=8;const cd=document.getElementById("cd");
  const t=setInterval(()=>{n--;cd.textContent=n>0?`Weiterleitung in ${n} Sekunden …`:"Weiterleitung …";if(n<=0){clearInterval(t);location.replace(url)}},1000);
  cd.textContent=`Weiterleitung in ${n} Sekunden …`;
})();
</script>
</body></html>
